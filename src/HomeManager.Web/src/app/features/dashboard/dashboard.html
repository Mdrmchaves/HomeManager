@if (!hasHouseholds()) {
  <app-household-setup />
} @else {
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- Greeting -->
    <div>
      <h1 class="text-2xl font-bold text-stone-800">Olá, {{ userName }}! 👋</h1>
      @if (selectedHousehold(); as household) {
        <p class="text-stone-500 mt-1">{{ household.name }}</p>
      }
    </div>

    <!-- Summary widgets -->
    <div class="grid grid-cols-2 gap-4">
      <app-summary-widget
        label="Património"
        [value]="totalValue()"
        subtitle="Valor estimado dos pertences"
        link="/inventory"
        theme="emerald"
        [iconSvg]="patrimonioIcon"
      />
      <app-summary-widget
        label="Em Falta"
        [value]="lowStockCount().toString()"
        subtitle="Artigos na despensa"
        link="/inventory"
        theme="amber"
        [iconSvg]="emFaltaIcon"
      />
    </div>

    <!-- Timeline -->
    <app-timeline-widget />

  </div>
}
