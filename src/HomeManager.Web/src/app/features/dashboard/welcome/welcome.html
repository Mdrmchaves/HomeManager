<div class="welcome-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Welcome to HomeManager!</mat-card-title>
      <mat-card-subtitle>You are not part of any household yet.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Create a new household or join an existing one to get started.</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-stroked-button routerLink="/household/create">Create Household</a>
      <a mat-flat-button color="primary" routerLink="/household/join">Join Household</a>
    </mat-card-actions>
  </mat-card>
</div>
