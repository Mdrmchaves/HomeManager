<div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-5">
  <h2 class="text-base font-semibold text-stone-800 mb-4">Próximas Ações</h2>

  @if (events.length === 0) {
    <p class="text-sm text-stone-400 py-4 text-center">Nenhuma acção próxima.</p>
  } @else {
    <div class="relative">
      <!-- Vertical timeline line -->
      <div class="absolute left-[7px] top-2 bottom-2 w-px bg-stone-200"></div>

      <div class="space-y-4">
        @for (event of events; track event.id) {
          <div class="flex gap-4 items-start">
            <!-- Dot -->
            <div class="relative z-10 flex-shrink-0 mt-0.5">
              <span class="block w-3.5 h-3.5 rounded-full border-2 border-white shadow-sm" [ngClass]="getDotClass(event.type)"></span>
            </div>

            <!-- Content -->
            <div class="flex-1 min-w-0 pb-1">
              <div class="flex items-start justify-between gap-2">
                <p class="text-sm text-stone-800 font-medium leading-snug">{{ event.title }}</p>
                <span class="text-xs font-semibold text-stone-400 flex-shrink-0 mt-0.5">{{ formatDate(event.date) }}</span>
              </div>
              <span class="inline-block mt-1 text-xs text-stone-400 bg-stone-100 px-2 py-0.5 rounded-full">{{ event.sourceModule }}</span>
            </div>
          </div>
        }
      </div>
    </div>
  }
</div>
