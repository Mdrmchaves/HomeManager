<div class="create-household-container">
  <mat-card class="create-card">
    <mat-card-header>
      <mat-card-title>
        <h2>🏠 Create New Household</h2>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="householdForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Household Name</mat-label>
          <input
            matInput
            formControlName="name"
            placeholder="My Awesome Home"
            [disabled]="loading || !!inviteCode"
          >
          <mat-error *ngIf="householdForm.get('name')?.hasError('required')">
            Name is required
          </mat-error>
          <mat-error *ngIf="householdForm.get('name')?.hasError('minlength')">
            Minimum 2 characters
          </mat-error>
        </mat-form-field>

        <!-- Show invite code after creation -->
        <div class="invite-code-section" *ngIf="inviteCode">
          <div class="success-message">
            <h3>✅ Household Created!</h3>
            <p>Share this code with others to invite them:</p>
            <div class="invite-code-box">
              <code>{{ inviteCode }}</code>
              <button
                mat-icon-button
                type="button"
                (click)="copyInviteCode()"
                matTooltip="Copy code"
              >
                📋
              </button>
            </div>
            <p class="redirect-message">Redirecting to inventory...</p>
          </div>
        </div>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width submit-btn"
          [disabled]="loading || householdForm.invalid || inviteCode"
        >
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">Create Household</span>
        </button>

        <button
          mat-button
          type="button"
          class="full-width"
          (click)="router.navigate(['/inventory'])"
          [disabled]="loading"
        >
          Cancel
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
