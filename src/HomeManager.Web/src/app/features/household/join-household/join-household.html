<div class="join-household-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Join a Household</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="joinForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Invite Code</mat-label>
          <input matInput formControlName="inviteCode" required>
          <mat-error *ngIf="joinForm.get('inviteCode')?.hasError('required')">
            Invite code is required
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loading">
          <span *ngIf="!loading">Join</span>
          <mat-spinner *ngIf="loading" [diameter]="24"></mat-spinner>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
