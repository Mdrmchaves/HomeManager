<div class="min-h-screen bg-stone-50 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">

    <!-- Brand -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center mb-4 shadow-md">
        <span class="text-white text-2xl font-bold">H</span>
      </div>
      <h1 class="text-2xl font-bold text-stone-800">HomeManager</h1>
      <p class="text-stone-500 text-sm mt-1">Gestão do seu lar, simplificada.</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">

      @if (emailSent) {
        <div class="flex flex-col items-center text-center py-4">
          <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center mb-5">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
            </svg>
          </div>
          <h2 class="text-lg font-bold text-stone-800 mb-2">Confirme o seu email</h2>
          <p class="text-stone-500 text-sm mb-1">Enviámos um link de confirmação para</p>
          <p class="text-emerald-700 text-sm font-medium mb-6">{{ email }}</p>
          <p class="text-stone-400 text-xs mb-8">Verifique também a pasta de spam caso não encontre o email.</p>
          <button
            type="button"
            (click)="backToLogin()"
            class="w-full bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold py-3 rounded-xl transition-colors duration-150"
          >
            Voltar ao login
          </button>
        </div>
      } @else {

      <!-- Mode toggle -->
      <div class="flex bg-stone-100 rounded-xl p-1 mb-6">
        <button
          type="button"
          class="flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-150"
          [class.bg-white]="mode === 'signin'"
          [class.shadow-sm]="mode === 'signin'"
          [class.text-stone-800]="mode === 'signin'"
          [class.text-stone-500]="mode !== 'signin'"
          (click)="switchMode('signin')"
        >Entrar</button>
        <button
          type="button"
          class="flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-150"
          [class.bg-white]="mode === 'signup'"
          [class.shadow-sm]="mode === 'signup'"
          [class.text-stone-800]="mode === 'signup'"
          [class.text-stone-500]="mode !== 'signup'"
          (click)="switchMode('signup')"
        >Criar conta</button>
      </div>

      <form (ngSubmit)="submit()" #f="ngForm">

        @if (mode === 'signup') {
          <div class="mb-4">
            <label class="block text-sm font-medium text-stone-700 mb-1.5" for="name">Nome</label>
            <input
              id="name"
              type="text"
              name="name"
              [(ngModel)]="name"
              required
              minlength="2"
              placeholder="O seu nome"
              class="w-full bg-white border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
            />
          </div>
        }

        <div class="mb-4">
          <label class="block text-sm font-medium text-stone-700 mb-1.5" for="email">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            placeholder="email@exemplo.pt"
            class="w-full bg-white border border-stone-200 rounded-xl px-4 py-3 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
          />
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-stone-700 mb-1.5" for="password">Palavra-passe</label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              required
              minlength="6"
              placeholder="Mínimo 6 caracteres"
              class="w-full bg-white border border-stone-200 rounded-xl px-4 py-3 pr-12 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
            />
            <button
              type="button"
              class="absolute inset-y-0 right-3 flex items-center text-stone-400 hover:text-stone-600 transition-colors"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
            >
              @if (showPassword) {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/>
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
            </button>
          </div>
        </div>

        @if (errorMessage) {
          <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl">
            <p class="text-sm text-red-700">{{ errorMessage }}</p>
          </div>
        }

        <button
          type="submit"
          [disabled]="loading || f.invalid"
          class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-300 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-colors duration-150"
        >
          @if (loading) {
            <span class="inline-flex items-center gap-2">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
              Aguarde...
            </span>
          } @else {
            {{ mode === 'signin' ? 'Entrar' : 'Criar conta' }}
          }
        </button>
      </form>

      }
    </div>
  </div>
</div>
